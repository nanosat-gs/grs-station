# Este repositório não publica pacote nenhum: ele orquestra. O pyproject existe
# só para o teste ponta a ponta, que precisa do Station Manager e do GRS
# Manager no mesmo processo — e é por isso que ele mora aqui e não neles.

[project]
name = "grs-station-e2e"
version = "0.1.0"
description = "Teste ponta a ponta da estação terrestre SpaceLab"
requires-python = ">=3.11"

[project.optional-dependencies]
# As git URLs servem ao CI, que quer testar o contrato entre as versões
# publicadas. No dia a dia, `bootstrap.ps1 -Dev` instala os dois em modo
# editável DEPOIS disto, e os installs locais vencem — assim o e2e exercita a
# sua árvore de trabalho sem exigir que você taggeie para rodar um teste.
dev = [
    "pytest>=8.0,<9.0",
    "pyzmq>=25,<26",
    "pyyaml>=6.0,<7.0",
    "mgm8 @ git+https://github.com/nanosat-gs/grs-station-manager@main",
    "grs-manager @ git+https://github.com/nanosat-gs/grs-manager@main",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
