# Compose único da estação terrestre.
#
# Cada bloco é um repositório independente, clonado em repos/ pelo bootstrap.
# Este arquivo não importa o compose de ninguém: declara a infra compartilhada
# (um postgres, uma rede) e constrói cada serviço apontando o build context
# para o clone correspondente.
#
# Rodar `docker compose up` sozinho testa AS IMAGENS, que é o que rodaria numa
# máquina de verdade. Para desenvolver contra a sua árvore de trabalho, some o
# override:
#
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d --build

# NÃO REMOVER a linha `name:` abaixo. Sem ela o compose deriva o prefixo dos
# volumes do nome do DIRETÓRIO, e um clone noutra pasta montaria
# `grs-station_postgres_data` — vazio. O initdb rodaria (volume vazio!), o
# schema nasceria limpo, os containers subiriam saudáveis, e todos os satélites
# e telecomandos teriam sumido sem uma única mensagem de erro. O nome abaixo é
# o do monorepo original, que é onde os volumes com os dados já existem.
name: gs-stationmanager

# Localização da estação, declarada UMA vez e reaproveitada por quem calcula
# órbita (TC Scheduler e Station Manager). Os dois precisam concordar sobre de
# onde a estação observa: se só um mudasse, o plano diria uma hora e o rotor
# apontaria para outro lugar. Para trocar, edite as variáveis GS_* no .env — não
# aqui. Os defaults são São Paulo, um EXEMPLO até haver a coordenada real.
x-ground-station: &ground-station
  GS_NAME: ${GS_NAME:-Estação de Teste}
  GS_LATITUDE_DEG: ${GS_LATITUDE_DEG:--23.5505}
  GS_LONGITUDE_DEG: ${GS_LONGITUDE_DEG:--46.6333}
  GS_ALTITUDE_M: ${GS_ALTITUDE_M:-760}
  GS_MIN_ELEVATION_DEG: ${GS_MIN_ELEVATION_DEG:-0}

# Rádios da estação, um por faixa, todos atrás do mesmo rotor (ver
# grs-doc/hardware.html: 3x USRP N210; antenas VHF 143-148 MHz e UHF
# 462-470 MHz). Cada downlink de satélite vai ao rádio cuja faixa o contém, e
# o Station Manager anuncia a sintonia dele no canal com o nome do rádio
# (freq.vhf, doppler.uhf). Declarado UMA vez: o Station Manager roteia com
# isto, e o TC Scheduler usa para o painel dizer que rádio ouve cada downlink.
# Se os dois discordassem, o painel prometeria um rádio e a estação usaria
# outro. O terceiro N210 (UHF 398-408 MHz, uplink da carga útil do FS-2) é de
# transmissão e não entra aqui.
x-radios: &radios
  STATION_RADIOS: ${STATION_RADIOS:-vhf=143000000-148000000,uhf=462000000-470000000}

services:
  # --- Infraestrutura compartilhada ---
  postgres:
    image: postgres:15-alpine
    container_name: spacelab-postgres
    environment:
      POSTGRES_USER: ${DB_USER:-admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-admin}
      POSTGRES_DB: ${DB_NAME:-tc_generator}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # O schema é propriedade do TC Generator: é ele quem cria satélites e
      # telecomandos. O TC Scheduler escreve nessas mesmas tabelas e confere o
      # contrato no boot (ver docs/schema-contract.md naquele repositório).
      #
      # Lembrete: docker-entrypoint-initdb.d SÓ RODA EM VOLUME VAZIO. Mudança
      # de schema exige ALTER TABLE manual ou `down -v`, que APAGA os dados.
      - ./repos/grs-tc-generator/resources/database/schema.sql:/docker-entrypoint-initdb.d/01-tc-generator.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-admin} -d ${DB_NAME:-tc_generator}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - spacelab-network

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: spacelab-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@spacelab.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_started
    networks:
      - spacelab-network

  # --- Control Desktop ---
  tc-generator-web:
    build: ./repos/grs-tc-generator
    container_name: spacelab-tc-generator
    ports:
      - "5000:5000"
    environment:
      PG_DATABASE_URL: postgresql+psycopg2://${DB_USER:-admin}:${DB_PASSWORD:-admin}@postgres:5432/${DB_NAME:-tc_generator}
      FLASK_APP: run.py
      FLASK_DEBUG: ${FLASK_DEBUG:-1}
      SECRET_KEY: ${SECRET_KEY:-dev-secret-key-change-in-production}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - spacelab-network

  grs-manager:
    build: ./repos/grs-manager
    container_name: spacelab-grs-manager
    # --host/--status-host precisam ser 0.0.0.0: os defaults são 127.0.0.1, que
    # dentro do container não aceitam conexão vinda de fora dele.
    command:
      - python
      - -m
      - grs_manager.main
      - --host=0.0.0.0
      - --port=4533
      - --station-manager-address=tcp://station-manager:5580
      - --status-host=0.0.0.0
      - --status-port=5590
    ports:
      - "4533:4533"   # rotctld (hamlib) — é aqui que um cliente hamlib conecta
      - "5590:5590"   # painel do operador
    environment:
      # O painel pergunta ao TC Scheduler o que ele planejou. Este é o único
      # serviço da estação que não conhece o Postgres — nem para ler. Sem esta
      # variável o painel funciona igual, só sem a parte de satélites.
      TC_SCHEDULER_API_URL: http://tc-scheduler:5591
      # Resolvido pelo navegador do operador (os links de telecomando abrem o
      # TC Generator), e não pelo container — por isso localhost.
      TC_GENERATOR_URL: ${TC_GENERATOR_URL:-http://localhost:5000}
    depends_on:
      - station-manager
      # Só ordem de subida, não requisito: com o Scheduler fora, o painel
      # continua sendo o controle de rotor, que é o que ele precisa fazer.
      - tc-scheduler
    networks:
      - spacelab-network

  # --- Control Server ---
  tc-scheduler:
    build: ./repos/grs-tc-scheduler
    container_name: spacelab-tc-scheduler
    command: ["python", "-m", "tc_scheduler.main"]
    ports:
      # API do plano — é daqui que o painel se serve. Só em localhost: ela
      # também recebe as ações do operador (pular/forçar passagem, recepção) e
      # não tem autenticação. O painel alcança pela rede interna do compose.
      - "127.0.0.1:5591:5591"
    environment:
      <<: [*ground-station, *radios]
      PG_DATABASE_URL: postgresql+psycopg2://${DB_USER:-admin}:${DB_PASSWORD:-admin}@postgres:5432/${DB_NAME:-tc_generator}
      STATION_MANAGER_ZMQ_ADDRESS: tcp://station-manager:5580
      SCHEDULER_HORIZON_HOURS: ${SCHEDULER_HORIZON_HOURS:-24}
      SCHEDULER_REPLAN_INTERVAL_SECONDS: ${SCHEDULER_REPLAN_INTERVAL_SECONDS:-300}
      TRACKING_POLL_INTERVAL_SECONDS: ${TRACKING_POLL_INTERVAL_SECONDS:-30}
      TRACKING_DATA_DIR: /app/data
      # Idade máxima do TLE em cache, em minutos, antes de revalidar no
      # CelesTrak. Este serviço é o único que escreve e lê esse cache.
      TRACKING_CACHE_MAX_AGE_MINUTES: ${TRACKING_CACHE_MAX_AGE_MINUTES:-15}
    depends_on:
      postgres:
        condition: service_healthy
      station-manager:
        condition: service_started
    volumes:
      # Cache de TLE: preserva o fallback offline do CelesTrak entre restarts.
      # Um processo só mexe nele, desde que o painel passou a pedir a
      # revalidação por HTTP em vez de escrever no mesmo volume.
      - tracking_data:/app/data
    networks:
      - spacelab-network

  station-manager:
    build: ./repos/grs-station-manager
    container_name: spacelab-station-manager
    # --rotor mock, e não zmq: o RotorManager copiado tem o socket SUB fixo em
    # tcp://localhost:5560 (src/mgm8/vendor/rotor_manager.py), o que só funciona
    # com o simulador no mesmo host de rede — nunca entre containers. Rodar
    # contra o rotor físico/simulado continua sendo fora do Docker.
    command:
      - python
      - -m
      - mgm8.rotor_zmq.main
      - --bind=tcp://0.0.0.0:5580
      - --rotor=mock
      # Abaixo desta elevação o satélite está do outro lado da Terra e o azimute
      # varia de forma abrupta — seguir isso só castigaria o rotor. Baixe para
      # -90 quando quiser exercitar o apontamento sem esperar uma passagem real.
      - --pointing-min-elevation=${STATION_POINTING_MIN_ELEVATION:-0}
      - --pointing-interval=${STATION_POINTING_INTERVAL_SECONDS:-1}
      # Anuncia a portadora e o Doppler de cada downlink do satélite rastreado
      # no canal do rádio que o cobre: freq.vhf/doppler.vhf, freq.uhf/...
      # (rádios em STATION_RADIOS). O Doppler é calculado para o meio do
      # intervalo entre dois ajustes. Só rede interna: quem assina são os
      # sintetizadores, um por rádio.
      - --tuning-bind=tcp://0.0.0.0:5581
      # Repassa o espectro dos blocos FFT (fft.vhf, fft.uhf) num endereço só,
      # para o Spectrum Monitor do Control Desktop. Rede interna, por ora.
      - --spectrum-bind=tcp://0.0.0.0:5583
    ports:
      - "5580:5580"   # ZMQ REP — comandos de rotor e ordens de rastreamento
    environment:
      # Mesma localização e mesmos rádios do TC Scheduler (ver o topo).
      <<: [*ground-station, *radios]
      # Ajuste fino da sintonia: as medidas dos blocos FFT de cada rádio.
      # Por IP fixo, e não por nome: os blocos só existem nos profiles de
      # recepção, e um nome que não resolve foi medido calando o socket SUB
      # inteiro. Um IP sem ninguém escutando só fica tentando, em silêncio.
      STATION_FFT_SOURCES: ${STATION_FFT_SOURCES:-vhf=tcp://172.30.0.24:5582,uhf=tcp://172.30.0.34:5582}
    networks:
      spacelab-network:
        ipv4_address: 172.30.0.10

  # --- Caminho de dados RX (FS-2) ---------------------------------------
  #
  # UMA CADEIA POR RÁDIO. O FS-2 desce em duas portadoras ao mesmo tempo
  # (firmware do TTC 2.0, radio_1/radio_0_config.h; coordenação IARU):
  #
  #   beacon  145,9 MHz  1200 baud  GMSK  -> cadeia VHF: os serviços SEM sufixo,
  #                                         portas de sempre (5556, 5555, 5558)
  #   dados   468,4 MHz  4800 baud  GMSK  -> cadeia UHF: serviços `-uhf`,
  #                                         portas +10 no host (5566, 5565, 5568)
  #
  # Dentro da rede cada container tem o seu IP, então as portas internas são
  # as mesmas nas duas cadeias; só o nome muda (grs-iq-rx / grs-iq-rx-uhf...).
  # Os pacotes das duas chegam à mesma tabela, marcados com o rádio.
  #
  # O caminho de recepção fica atrás de profiles e NÃO sobe num
  # `docker compose up` comum. Um profile por FONTE de IQ — as fontes bindam
  # a mesma :5556 e respondem pelo mesmo nome (grs-iq-rx), então nunca sobem
  # juntas, e demodulador, detector e gravador não sabem qual está ali:
  #
  #   docker compose --profile rx     up -d --build   USRP N210 (o rádio da estação)
  #   docker compose --profile rtlsdr up -d --build   dongle RTL-SDR (grs-iq-rx em C)
  #   docker compose --profile rxsim  up -d --build   simulador, sem hardware
  #
  # e, com a fonte ao vivo DESLIGADA, o replay de uma captura:
  #
  #   docker compose run --rm --use-aliases grs-iq-replay replay /app/captures/<nome> --count-packets
  #
  # Os blocos de RF adotados são forks GPL v3 (spacelab-ufsc -> nanosat-gs);
  # o `dockerfile:` deles aponta para docker/ aqui no orquestrador, para o
  # diff contra o upstream ficar pequeno. Ver docs/rx-datapath.md.

  # O RÁDIO DA ESTAÇÃO: USRP N210, Gigabit Ethernet, via python3-uhd.
  #
  # Painel de configuração em http://localhost:8091 — IP do rádio, teste de
  # conexão, frequência, ganho, antena, referência de relógio. A configuração
  # fica no volume usrp_config e sobrevive a restart. Sem o rádio o serviço
  # fica DE PÉ, mostrando por que não conectou (o grs-iq-rx em C sai com
  # EXIT_FAILURE, e aí não haveria onde corrigir o IP).
  #
  # Pede 250 kS/s ao N210 (exato: 100 MHz / 400) e reamostra 24/25 para
  # publicar os 240 kS/s do cano. Ver docker/grs-iq-rx-usrp.Dockerfile.
  #
  # REDE, a validar com o rádio: o UHD fala UDP com o N210. Atrás do NAT da
  # rede bridge o teste por IP funciona, a descoberta por broadcast não. Se o
  # stream não passar, num host Linux o caminho é `network_mode: host` — mas
  # aí o alias grs-iq-rx deixa de existir e o demodulador tem de apontar para
  # o IP do host (RX_IQ_SOURCE).
  grs-iq-rx-usrp:
    build:
      context: ./repos/grs-iq-rx
      dockerfile: ../../docker/grs-iq-rx-usrp.Dockerfile
    container_name: spacelab-grs-iq-rx-usrp
    profiles: ["rx"]
    environment:
      GRS_IQ_RX_CONFIG: /app/config/sdr.json
      GRS_IQ_RX_PANEL_PORT: "8091"
      # De onde vem o `tune` e a sintonia inicial quando ainda não há
      # configuração salva. Depois do primeiro "Salvar" no painel vale o que
      # estiver no sdr.json.
      GRS_IQ_RX_DEFAULT_TUNE_SOURCE: tcp://grs-frequency-synthesizer:5557
      GRS_IQ_RX_DEFAULT_CENTER_FREQUENCY_HZ: ${RX_CENTER_FREQ_HZ:-145900000}
    ports:
      - "5556:5556"   # ZMQ PUB — IQ em cf32_le, sem frame de tópico
      # Só em 127.0.0.1: o painel não tem autenticação e reconfigura o rádio.
      - "127.0.0.1:8091:8091"
    volumes:
      - usrp_config:/app/config
    restart: unless-stopped
    networks:
      spacelab-network:
        ipv4_address: 172.30.0.20
        aliases:
          - grs-iq-rx

  # DONGLE RTL-SDR: o grs-iq-rx em C, do plano original da fatia. Não é o
  # rádio da estação (o N210 é); fica para quem tiver um dongle.
  grs-iq-rx:
    build:
      context: ./repos/grs-iq-rx
      dockerfile: ../../docker/grs-iq-rx.Dockerfile
    container_name: spacelab-grs-iq-rx
    profiles: ["rtlsdr"]
    command:
      - grs_iq_rx
      # -v não é opcional: o main.c só escreve em stderr quando verbose está
      # ligado. Sem ele, "não achou o SDR" e "não conseguiu dar bind na 5556"
      # são o mesmo silêncio.
      - -v
      # 145,9 MHz: o beacon do FS-2 (firmware do TTC 2.0 e coordenação IARU).
      - --frequency=${RX_CENTER_FREQ_HZ:-145900000}
      # 240 kS/s. O RTL-SDR só aceita 225001–300000 e 900001–3200000 S/s:
      # pedir 48 kS/s (a constante do demodulador) NÃO dá erro, o driver
      # entrega outra taxa calado. E 240000/4800 = 50 amostras por símbolo,
      # exato. Ver docs/rx-datapath.md.
      - --sample-rate=${RX_SAMPLE_RATE_HZ:-240000}
      # 0 = ganho automático (AGC do tuner).
      - --gain=${RX_GAIN:-0}
    ports:
      - "5556:5556"   # ZMQ PUB — IQ em cf32_le, sem frame de tópico
    # O dongle precisa ser passado para dentro do container. Descomente na
    # máquina que tem o hardware; em Docker Desktop no Windows isto NÃO
    # funciona (não há passagem de USB para a VM) — ali o caminho é rodar o
    # grs-iq-rx no host, ou usar replay.
    # devices:
    #   - /dev/bus/usb:/dev/bus/usb
    #
    # "no", e não "unless-stopped": sem SDR o processo sai na hora, e um
    # restart automático viraria laço de falha enchendo o log.
    restart: "no"
    networks:
      spacelab-network:
        ipv4_address: 172.30.0.20

  grs-demodulator:
    build:
      context: ./repos/grs-demodulator
      dockerfile: ../../docker/grs-demodulator.Dockerfile
    container_name: spacelab-grs-demodulator
    # Em todos os profiles de recepção: o demodulador é o mesmo, qualquer que
    # seja a fonte de IQ.
    profiles: ["rx", "rtlsdr", "rxsim"]
    ports:
      - "5555:5555"   # ZMQ PUB — bits. Ver a colisão de porta em docs/rx-datapath.md
    environment:
      # Estes endereços eram HARDCODED em localhost, o que dentro de um
      # container significa que o demodulador assinava a si mesmo: subia
      # saudável, bloqueava no recv() e não processava uma amostra. Agora são
      # configuração.
      GRS_DEMOD_IQ_SOURCE: ${RX_IQ_SOURCE:-tcp://grs-iq-rx:5556}
      GRS_DEMOD_BITS_BIND: tcp://*:5555
      # A taxa do CANO, igual para todas as fontes (o USRP reamostra para
      # ela). Tem de bater exatamente: medido na tools/bancada_demod.py, 0,08%
      # de diferença já derruba ~65% dos pacotes.
      GRS_DEMOD_SAMPLE_RATE_HZ: ${RX_SAMPLE_RATE_HZ:-240000}
      # 1200: o beacon do FS-2 em 145,9 MHz (radio_1_config.h do TTC 2.0:
      # Rsymb 1200, Fdev 300 Hz). 4800 é o do enlace de dados em UHF, na
      # cadeia -uhf. Medido na bancada: até ~200 Hz de erro de sintonia a
      # SNR 10 dB, 300 Hz a SNR 20 dB.
      GRS_DEMOD_BAUD: ${RX_BAUD:-1200}
      GRS_DEMOD_BT: ${RX_BT:-0.5}
    # Sem depends_on do grs-iq-rx: no profile rxsim ele não existe, e o
    # demodulador apenas reconecta até o publicador aparecer.
    restart: "no"
    networks:
      spacelab-network:
        ipv4_address: 172.30.0.22

  grs-syncword-detector:
    build:
      context: ./repos/grs-syncword-detector
      dockerfile: ../../docker/grs-syncword-detector.Dockerfile
    container_name: spacelab-grs-syncword-detector
    profiles: ["rx", "rtlsdr", "rxsim"]
    ports:
      - "5558:5558"   # ZMQ PUB — raw packets. É daqui que a fatia de decode se serve
    environment:
      GRS_SYNCWORD_BITS_SOURCE: tcp://grs-demodulator:5555
      GRS_SYNCWORD_PACKETS_BIND: tcp://*:5558
      # 5D E6 2A 7E é o NGH_SYNC do ngham.c. NÃO BA67547E (a versão com bits
      # invertidos que o documento da fatia carregava): contra uma gravação
      # real do FloripaSat-1, BA67547E achou zero pacotes e 5DE62A7E achou 19.
      GRS_SYNCWORD_BYTES: ${RX_SYNCWORD:-5DE62A7E}
      # Quantos bytes publicar depois do syncword. Este estágio NÃO sabe onde
      # o frame termina — o comprimento vive dentro do NGHam, e parsear NGHam
      # é trabalho do decodificador. Então publica-se uma fatia generosa e o
      # decodificador pega o que precisa. 255 cobre o maior frame NGHam.
      GRS_SYNCWORD_PACKET_BYTES: ${RX_PACKET_BYTES:-255}
      # Tolerância de erro de bit no casamento do syncword. Passagem real
      # nunca é limpa, e um detector que só aceita syncword perfeito descarta
      # frames que a correção de erro recuperaria.
      GRS_SYNCWORD_MAX_ERRORS: ${RX_SYNCWORD_MAX_ERRORS:-1}
    depends_on:
      - grs-demodulator
    restart: "no"
    networks:
      spacelab-network:
        ipv4_address: 172.30.0.23

  # SINTETIZADOR DE FREQUÊNCIA — fecha a correção de Doppler.
  #
  #   Station Manager ──:5581 [freq][doppler]──▶ sintetizador ──:5557 [tune]──▶ receptor
  #
  # Soma a nominal do satélite (cadastrada no TC Scheduler) e o Doppler que o
  # Station Manager prevê a cada segundo, e manda o receptor sintonizar ali.
  # Sem anúncios (fora de passagem), não publica nada: o receptor fica na
  # última sintonia. Cair ou ser parado não afeta o rotor — o apontamento não
  # passa por aqui.
  #
  # Fora do profile `rtlsdr`: o grs-iq-rx em C não tem `tune`.
  grs-frequency-synthesizer:
    build:
      context: ./repos/grs-frequency-synthesizer
      dockerfile: ../../docker/grs-frequency-synthesizer.Dockerfile
    container_name: spacelab-grs-frequency-synthesizer
    profiles: ["rx", "rxsim"]
    command:
      - python
      - frequency_synthesizer.py
      - --bind=tcp://*:5557
      - --station-manager=tcp://station-manager:5581
      # O canal do rádio VHF: assina freq.vhf/doppler.vhf.
      - --channel=vhf
    # Sem porta publicada: só os receptores, na rede interna, assinam o tune.
    # (tools/send_tune.py, no host, continua livre para BINDAR a 5557 quando
    # o sintetizador estiver parado.)
    restart: unless-stopped
    networks:
      spacelab-network:
        ipv4_address: 172.30.0.21

  # BLOCO FFT ("FFT x3" no diagrama) — um por rádio, ao lado do receptor.
  #
  # Assina o IQ do rádio, calcula o espectro e mede, a cada rajada do
  # satélite, a que distância do centro ela chegou. O IQ (~1,9 MB/s) não sai
  # daqui; ao Station Manager vão só a medida (afc.<rádio>) e o espectro
  # reduzido (fft.<rádio>). O Station Manager integra a medida no ajuste fino
  # e o sintetizador sintoniza em nominal + Doppler + ajuste — é o que corrige
  # o erro do oscilador do satélite, que o Doppler previsto não vê.
  grs-fft:
    build: ./repos/grs-fft
    container_name: spacelab-grs-fft
    profiles: ["rx", "rxsim"]
    command:
      - python
      - -m
      - grs_fft.main
      - --radio=vhf
      - --iq-source=tcp://grs-iq-rx:5556
      - --bind=tcp://*:5582
      - --sample-rate=${RX_SAMPLE_RATE_HZ:-240000}
      # A taxa define a largura que um sinal precisa ter para ser o satélite:
      # uma portadora pura (interferência) é estreita demais e é recusada.
      - --baud=${RX_BAUD:-1200}
      - --window-hz=${FFT_WINDOW_HZ:-8000}
    restart: unless-stopped
    networks:
      spacelab-network:
        ipv4_address: 172.30.0.24

  grs-fft-uhf:
    build: ./repos/grs-fft
    container_name: spacelab-grs-fft-uhf
    profiles: ["rx", "rxsim"]
    command:
      - python
      - -m
      - grs_fft.main
      - --radio=uhf
      - --iq-source=tcp://grs-iq-rx-uhf:5556
      - --bind=tcp://*:5582
      - --sample-rate=${RX_SAMPLE_RATE_HZ:-240000}
      - --baud=${RX_UHF_BAUD:-4800}
      - --window-hz=${FFT_UHF_WINDOW_HZ:-8000}
    restart: unless-stopped
    networks:
      spacelab-network:
        ipv4_address: 172.30.0.34

  # SDR VIRTUAL — profile `rxsim`, e não `rx`.
  #
  # Dois profiles porque são dois mundos que não podem subir juntos: o
  # grs-sdr-sim BINDA a :5556, exatamente como o grs-iq-rx. Os dois ao mesmo
  # tempo disputam a porta, e quem perde cai em silêncio.
  #
  #   docker compose --profile rxsim up -d --build   sem hardware
  #   docker compose --profile rx    up -d --build   com dongle
  #
  # Tudo o mais é idêntico: mesmo envelope, mesma porta, mesmo `tune`. O
  # demodulador e o detector não têm como saber qual dos dois está do outro
  # lado — que é o ponto.
  grs-sdr-sim:
    build: ./repos/grs-sdr-sim
    container_name: spacelab-grs-sdr-sim
    profiles: ["rxsim"]
    command:
      - python
      - -m
      - sdr_sim.main
      - --bind=tcp://*:5556
      - --frequency=${RX_CENTER_FREQ_HZ:-145900000}
      - --fs2-frequency=${RX_CENTER_FREQ_HZ:-145900000}
      # Erro do oscilador do satélite, em Hz: o que o ajuste fino tem de achar.
      # 0 = oscilador perfeito. Também muda pelo painel, sem reiniciar.
      - --fs2-offset-hz=${SIM_FS2_OFFSET_HZ:-0}
      - --sample-rate=${RX_SAMPLE_RATE_HZ:-240000}
      - --baud=${RX_BAUD:-1200}
      - --emitters=${SIM_EMITTERS:-fs2}
      # continuous: rajadas sem parar. manual: o FS-2 fica calado até o
      # painel pedir "enviar 1 pacote". Dá para trocar no painel sem reiniciar.
      - --fs2-mode=${SIM_FS2_MODE:-continuous}
      - --snr-db=${SIM_SNR_DB:-20}
      # 0 desliga o Doppler. Com um valor, o sinal varre a banda ao longo de
      # --pass-duration, como numa passagem de verdade.
      - --doppler-hz=${SIM_DOPPLER_HZ:-0}
      - --pass-duration=${SIM_PASS_DURATION:-600}
      # Doppler da ÓRBITA REAL: o FS-2 simulado imita o satélite deste NORAD
      # (TLE do CelesTrak), visto da estação (GS_* abaixo), e fica calado
      # abaixo do horizonte. Vazio = sem órbita; também dá para ligar pelo
      # painel. SIM_ORBIT_MODE=next-pass adianta o relógio do satélite para a
      # próxima passagem começar agora.
      - --orbit-norad=${SIM_ORBIT_NORAD:-}
      - --orbit-mode=${SIM_ORBIT_MODE:-realtime}
      # Só para COMPARAR: o painel mostra o Doppler que o Station Manager
      # anuncia ao lado do que o simulador impõe. Nunca é aplicado ao sinal.
      - --station-tuning-source=tcp://station-manager:5581
      - --station-tuning-channel=vhf
      # Semente fixa: sem ela, um teste que falha uma vez em dez não é
      # investigável.
      - --seed=${SIM_SEED:-1}
      # Painel de controle: http://localhost:8090 — espectro ao vivo,
      # sintonia, SNR, emissores, Doppler, e a conferência dos pacotes que
      # chegam ao detector contra o que o simulador transmitiu.
      - --panel-port=8090
      - --packets-source=tcp://grs-syncword-detector:5558
      # O simulador OBEDECE ao sintetizador: é assim que a malha de Doppler
      # fecha sem hardware. Sem passagem rastreada, o sintetizador não publica
      # nada e a sintonia fica onde estiver (inclusive a do painel).
      - --tune-source=tcp://grs-frequency-synthesizer:5557
    ports:
      - "5556:5556"
      # Só em 127.0.0.1: o painel não tem autenticação e muda o simulador.
      - "127.0.0.1:8090:8090"
    environment:
      # A mesma estação do TC Scheduler e do Station Manager: o Doppler da
      # órbita depende de onde se está olhando.
      <<: *ground-station
    restart: "no"
    networks:
      spacelab-network:
        # Responde pelo nome do rádio real. Os dois nunca sobem juntos (mesma
        # :5556), então quem estiver de pé é "o grs-iq-rx" — e demodulador e
        # gravador funcionam nos dois profiles sem nenhuma variável no .env.
        ipv4_address: 172.30.0.20
        aliases:
          - grs-iq-rx

  grs-iq-recorder:
    build: ./repos/grs-iq-recorder
    container_name: spacelab-grs-iq-recorder
    profiles: ["rx", "rtlsdr", "rxsim"]
    environment:
      RECORDER_PROFILE: ${RECORDER_PROFILE:-grs-rx-fs2}
      # Conecta na fonte de IQ ao vivo, seja ela qual for (todas respondem
      # por grs-iq-rx). O replay NÃO roda aqui: ver grs-iq-replay.
      RECORDER_IQ_SOURCE_ADDRESS: tcp://grs-iq-rx:5556
      RECORDER_IQ_PUBLISH_ADDRESS: tcp://*:5556
      RECORDER_CAPTURE_DIR: /app/captures
      RECORDER_MAX_CAPTURE_SECONDS: ${RECORDER_MAX_CAPTURE_SECONDS:-60}
      # --count-packets assina aqui a saída do detector.
      RECORDER_PACKETS_ADDRESS: tcp://grs-syncword-detector:5558
      # Sem esta variável o gravador grava do mesmo jeito, só não indexa: a
      # captura é o artefato, o índice é conveniência.
      PG_DATABASE_URL: postgresql+psycopg2://${DB_USER:-admin}:${DB_PASSWORD:-admin}@postgres:5432/${DB_NAME:-tc_generator}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      # Volume nomeado, e não bind mount: a 240 kS/s são 1,92 MB/s, ~115 MB
      # por minuto. Uma campanha despejada dentro da árvore de trabalho seria
      # gigabytes indo para o build context no próximo `docker build`.
      - iq_captures:/app/captures
    networks:
      - spacelab-network

  # ARQUIVO DE RAW PACKETS: grava no banco cada pacote que o detector publica.
  #
  # Sem ele, o que sai da :5558 some — PUB não guarda nada, e um pacote
  # publicado sem assinante está perdido. Mesma imagem do gravador, outro
  # comando. Tabela mission_control.raw_packets, append-only, com o horário
  # de recepção em solo (µs), o cabeçalho do detector e o payload cru.
  #
  # Se o banco cair, os pacotes ficam num buffer e são regravados quando ele
  # volta; o que passar do teto do buffer é contado e avisado no log.
  #
  # Replays também passam pelo detector e também são arquivados: são
  # recepções legítimas do cano, e ficam distinguíveis pelo horário.
  #
  # Conferir o que foi gravado:
  #   docker compose exec grs-packet-archiver python -m iq_recorder.main packets
  grs-packet-archiver:
    build: ./repos/grs-iq-recorder
    container_name: spacelab-grs-packet-archiver
    profiles: ["rx", "rtlsdr", "rxsim"]
    command: ["python", "-m", "iq_recorder.main", "archive-packets"]
    environment:
      RECORDER_PROFILE: ${RECORDER_PROFILE:-grs-rx-fs2}
      RECORDER_PACKETS_ADDRESS: tcp://grs-syncword-detector:5558
      # Coluna `radio` de cada pacote: o arquivador -uhf grava "uhf".
      RECORDER_RADIO: vhf
      PG_DATABASE_URL: postgresql+psycopg2://${DB_USER:-admin}:${DB_PASSWORD:-admin}@postgres:5432/${DB_NAME:-tc_generator}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - spacelab-network

  # --- Cadeia UHF: dados do FS-2 em 468,4 MHz, 4800 baud ----------------------
  #
  # A mesma cadeia do VHF, serviço por serviço, com sufixo -uhf. Só o que
  # muda está comentado; o resto tem o porquê na versão VHF acima. Fora do
  # profile `rtlsdr`: o dongle é um só, e fica com o VHF.

  # O N210 da UHF (antena 466CP42, 462-470 MHz). Configuração própria
  # (volume usrp_uhf_config) e painel próprio em http://localhost:8092.
  grs-iq-rx-usrp-uhf:
    build:
      context: ./repos/grs-iq-rx
      dockerfile: ../../docker/grs-iq-rx-usrp.Dockerfile
    container_name: spacelab-grs-iq-rx-usrp-uhf
    profiles: ["rx"]
    environment:
      GRS_IQ_RX_CONFIG: /app/config/sdr.json
      GRS_IQ_RX_PANEL_PORT: "8091"
      GRS_IQ_RX_DEFAULT_TUNE_SOURCE: tcp://grs-frequency-synthesizer-uhf:5557
      GRS_IQ_RX_DEFAULT_CENTER_FREQUENCY_HZ: ${RX_UHF_CENTER_FREQ_HZ:-468400000}
    ports:
      - "5566:5556"
      - "127.0.0.1:8092:8091"
    volumes:
      - usrp_uhf_config:/app/config
    restart: unless-stopped
    networks:
      spacelab-network:
        ipv4_address: 172.30.0.30
        aliases:
          - grs-iq-rx-uhf

  grs-sdr-sim-uhf:
    build: ./repos/grs-sdr-sim
    container_name: spacelab-grs-sdr-sim-uhf
    profiles: ["rxsim"]
    command:
      - python
      - -m
      - sdr_sim.main
      - --bind=tcp://*:5556
      - --frequency=${RX_UHF_CENTER_FREQ_HZ:-468400000}
      - --fs2-frequency=${RX_UHF_CENTER_FREQ_HZ:-468400000}
      - --fs2-offset-hz=${SIM_UHF_FS2_OFFSET_HZ:-0}
      - --sample-rate=${RX_SAMPLE_RATE_HZ:-240000}
      - --baud=${RX_UHF_BAUD:-4800}
      - --emitters=fs2
      - --fs2-mode=${SIM_FS2_MODE:-continuous}
      - --snr-db=${SIM_SNR_DB:-20}
      # O mesmo satélite do simulador VHF: as duas portadoras saem da mesma
      # órbita, e o Doppler da UHF é 468,4/145,9 = 3,2 vezes o da VHF.
      - --orbit-norad=${SIM_ORBIT_NORAD:-}
      - --orbit-mode=${SIM_ORBIT_MODE:-realtime}
      - --station-tuning-source=tcp://station-manager:5581
      - --station-tuning-channel=uhf
      # Semente diferente da VHF: o mesmo ruído nas duas cadeias esconderia
      # erro que dependesse do ruído.
      - --seed=${SIM_UHF_SEED:-2}
      - --panel-port=8090
      - --packets-source=tcp://grs-syncword-detector-uhf:5558
      - --tune-source=tcp://grs-frequency-synthesizer-uhf:5557
    ports:
      - "5566:5556"
      - "127.0.0.1:8093:8090"
    environment:
      <<: *ground-station
    restart: "no"
    networks:
      spacelab-network:
        ipv4_address: 172.30.0.30
        aliases:
          - grs-iq-rx-uhf

  grs-frequency-synthesizer-uhf:
    build:
      context: ./repos/grs-frequency-synthesizer
      dockerfile: ../../docker/grs-frequency-synthesizer.Dockerfile
    container_name: spacelab-grs-frequency-synthesizer-uhf
    profiles: ["rx", "rxsim"]
    command:
      - python
      - frequency_synthesizer.py
      - --bind=tcp://*:5557
      - --station-manager=tcp://station-manager:5581
      - --channel=uhf
    restart: unless-stopped
    networks:
      spacelab-network:
        ipv4_address: 172.30.0.31

  grs-demodulator-uhf:
    build:
      context: ./repos/grs-demodulator
      dockerfile: ../../docker/grs-demodulator.Dockerfile
    container_name: spacelab-grs-demodulator-uhf
    profiles: ["rx", "rxsim"]
    ports:
      - "5565:5555"
    environment:
      GRS_DEMOD_IQ_SOURCE: ${RX_UHF_IQ_SOURCE:-tcp://grs-iq-rx-uhf:5556}
      GRS_DEMOD_BITS_BIND: tcp://*:5555
      GRS_DEMOD_SAMPLE_RATE_HZ: ${RX_SAMPLE_RATE_HZ:-240000}
      # 4800: radio_0_config.h do TTC 2.0 (Rsymb 4800, Fdev 1200 Hz).
      GRS_DEMOD_BAUD: ${RX_UHF_BAUD:-4800}
      GRS_DEMOD_BT: ${RX_BT:-0.5}
    restart: "no"
    networks:
      spacelab-network:
        ipv4_address: 172.30.0.32

  grs-syncword-detector-uhf:
    build:
      context: ./repos/grs-syncword-detector
      dockerfile: ../../docker/grs-syncword-detector.Dockerfile
    container_name: spacelab-grs-syncword-detector-uhf
    profiles: ["rx", "rxsim"]
    ports:
      - "5568:5558"
    environment:
      GRS_SYNCWORD_BITS_SOURCE: tcp://grs-demodulator-uhf:5555
      GRS_SYNCWORD_PACKETS_BIND: tcp://*:5558
      # O mesmo NGHam nos dois enlaces do FS-2.
      GRS_SYNCWORD_BYTES: ${RX_SYNCWORD:-5DE62A7E}
      GRS_SYNCWORD_PACKET_BYTES: ${RX_PACKET_BYTES:-255}
      GRS_SYNCWORD_MAX_ERRORS: ${RX_SYNCWORD_MAX_ERRORS:-1}
    depends_on:
      - grs-demodulator-uhf
    restart: "no"
    networks:
      spacelab-network:
        ipv4_address: 172.30.0.33

  grs-packet-archiver-uhf:
    build: ./repos/grs-iq-recorder
    container_name: spacelab-grs-packet-archiver-uhf
    profiles: ["rx", "rxsim"]
    command: ["python", "-m", "iq_recorder.main", "archive-packets"]
    environment:
      RECORDER_PROFILE: ${RECORDER_PROFILE:-grs-rx-fs2}
      RECORDER_PACKETS_ADDRESS: tcp://grs-syncword-detector-uhf:5558
      RECORDER_RADIO: uhf
      PG_DATABASE_URL: postgresql+psycopg2://${DB_USER:-admin}:${DB_PASSWORD:-admin}@postgres:5432/${DB_NAME:-tc_generator}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - spacelab-network

  # REPLAY: republica uma captura como se fosse a fonte ao vivo.
  #
  # Serviço próprio, e não um comando no grs-iq-recorder, por um motivo
  # medido: o demodulador assina UM nome, grs-iq-rx, e o replay precisa
  # responder por ele. Assinar dois nomes (o da fonte e o do gravador) foi
  # testado e descartado: com um nome que não resolve na lista, o ZMQ não
  # recebeu NADA nem do outro — 0 lotes em 5 s contra 146 sem ele.
  #
  # Só roda sob demanda, com a fonte ao vivo DESLIGADA (mesma :5556, mesmo
  # nome), e --use-aliases é obrigatório — sem ele o `run` não aplica o alias:
  #
  #   docker compose stop grs-sdr-sim          (ou grs-iq-rx-usrp / grs-iq-rx)
  #   docker compose run --rm --use-aliases grs-iq-replay replay /app/captures/<nome> --count-packets
  grs-iq-replay:
    build: ./repos/grs-iq-recorder
    profiles: ["replay"]
    entrypoint: ["python", "-m", "iq_recorder.main"]
    environment:
      RECORDER_PROFILE: ${RECORDER_PROFILE:-grs-rx-fs2}
      RECORDER_IQ_PUBLISH_ADDRESS: tcp://*:5556
      RECORDER_CAPTURE_DIR: /app/captures
      RECORDER_PACKETS_ADDRESS: tcp://grs-syncword-detector:5558
    volumes:
      - iq_captures:/app/captures
    networks:
      spacelab-network:
        ipv4_address: 172.30.0.20
        aliases:
          - grs-iq-rx

volumes:
  postgres_data:
  tracking_data:
  # Capturas de IQ. Volume nomeado porque elas têm de sobreviver ao container
  # e não podem cair dentro da árvore de trabalho.
  iq_captures:
  # Configuração do receptor USRP (IP do rádio etc.), editada pelo painel.
  # Uma por N210: o da VHF (painel 8091) e o da UHF (painel 8092).
  usrp_config:
  usrp_uhf_config:

networks:
  # Sub-rede FIXA, com IP fixo (ipv4_address) para quem publica ZMQ ou
  # responde REQ. O motivo foi medido, e é sério: o ZMQ resolve
  # o nome do serviço UMA vez e, se a conexão cai, reconecta no IP antigo.
  # Recriando dois detectores juntos, o Docker deu ao detector VHF o IP que era
  # do UHF — e o arquivador UHF passou a gravar pacotes do beacon marcados como
  # "uhf", sem erro nenhum. Com IP fixo, um IP nunca muda de dono.
  #
  #   172.30.0.10        station-manager
  #   172.30.0.20-24     cadeia VHF: fonte de IQ (sim/USRP/RTL-SDR/replay,
  #                      que nunca rodam juntos), sintetizador, demodulador,
  #                      detector, bloco FFT
  #   172.30.0.30-34     cadeia UHF: idem
  #   172.30.1.0/24      todo o resto, dinâmico — fora da faixa dos fixos, para
  #                      um serviço sem IP fixo nunca ocupar o de um que tem
  spacelab-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/16
          ip_range: 172.30.1.0/24
          gateway: 172.30.0.1
