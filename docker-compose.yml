# Compose único da estação terrestre.
#
# Cada bloco continua sendo um repositório independente com o seu próprio
# Dockerfile e o seu próprio compose (para rodar sozinho em desenvolvimento).
# Este arquivo não importa o compose de ninguém: declara a infra compartilhada
# (um postgres, uma rede) e constrói cada serviço apontando o build context
# para o diretório do submódulo correspondente em services/.

services:
  # --- Infraestrutura compartilhada ---
  postgres:
    image: postgres:15-alpine
    container_name: spacelab-postgres
    environment:
      POSTGRES_USER: ${DB_USER:-admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-admin}
      POSTGRES_DB: ${DB_NAME:-tc_generator}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # O prefixo numérico fixa a ordem: o entrypoint do postgres roda os .sql
      # em ordem alfabética, e o DDL do orquestrador (02-*) depende das tabelas
      # que o schema do TC Generator (01-*) cria.
      - ./services/grs-tc-generator/resources/database/schema.sql:/docker-entrypoint-initdb.d/01-tc-generator.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-admin} -d ${DB_NAME:-tc_generator}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - spacelab-network

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: spacelab-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@spacelab.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_started
    networks:
      - spacelab-network

  # --- Control Desktop ---
  tc-generator-web:
    build: ./services/grs-tc-generator
    container_name: spacelab-tc-generator
    ports:
      - "5000:5000"
    environment:
      PG_DATABASE_URL: postgresql+psycopg2://${DB_USER:-admin}:${DB_PASSWORD:-admin}@postgres:5432/${DB_NAME:-tc_generator}
      FLASK_APP: run.py
      FLASK_DEBUG: ${FLASK_DEBUG:-1}
      SECRET_KEY: ${SECRET_KEY:-dev-secret-key-change-in-production}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./services/grs-tc-generator/app:/app/app
      - ./services/grs-tc-generator/run.py:/app/run.py
    networks:
      - spacelab-network

  grs-manager:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: spacelab-grs-manager
    # --host/--status-host precisam ser 0.0.0.0: os defaults são 127.0.0.1, que
    # dentro do container não aceitam conexão vinda de fora dele.
    command:
      - python
      - -m
      - grs_manager.main
      - --host=0.0.0.0
      - --port=4533
      - --station-manager-address=tcp://station-manager:5580
      - --status-host=0.0.0.0
      - --status-port=5590
    ports:
      - "4533:4533"   # rotctld (hamlib) — é aqui que o gpredict conecta
      - "5590:5590"   # painel de status (SSE)
    environment:
      # O painel pergunta ao TC Scheduler o que ele planejou, em vez de abrir
      # o banco. Este é o único serviço da estação que não conhece o Postgres
      # — nem para ler. Sem esta variável o painel funciona igual, só sem a
      # parte de satélites.
      TC_SCHEDULER_API_URL: http://tc-scheduler:5591
      # Resolvido pelo navegador do operador (os links de telecomando abrem o
      # TC Generator), e não pelo container — por isso localhost.
      TC_GENERATOR_URL: ${TC_GENERATOR_URL:-http://localhost:5000}
    # As coordenadas GS_* saíram junto com o acesso ao banco: quem propaga a
    # órbita agora é o Scheduler, e o painel só desenha o que recebe pronto.
    depends_on:
      - station-manager
      # Só ordem de subida, não requisito: com o Scheduler fora, o painel
      # continua sendo o controle de rotor, que é o que ele precisa fazer.
      - tc-scheduler
    volumes:
      - ./src:/app/src
      - ./libs:/app/libs
    networks:
      - spacelab-network

  # --- Control Server ---
  tc-scheduler:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: spacelab-tc-scheduler
    command: ["python", "-m", "tc_scheduler.main"]
    environment:
      PG_DATABASE_URL: postgresql+psycopg2://${DB_USER:-admin}:${DB_PASSWORD:-admin}@postgres:5432/${DB_NAME:-tc_generator}
      STATION_MANAGER_ZMQ_ADDRESS: tcp://station-manager:5580
      SCHEDULER_HORIZON_HOURS: ${SCHEDULER_HORIZON_HOURS:-24}
      SCHEDULER_REPLAN_INTERVAL_SECONDS: ${SCHEDULER_REPLAN_INTERVAL_SECONDS:-300}
      TRACKING_POLL_INTERVAL_SECONDS: ${TRACKING_POLL_INTERVAL_SECONDS:-30}
      # Coordenadas da estação. Os defaults da biblioteca são um EXEMPLO
      # (São Paulo) e precisam ser trocados pelos da estação real.
      GS_NAME: ${GS_NAME:-Estação de Teste}
      GS_LATITUDE_DEG: ${GS_LATITUDE_DEG:--23.5505}
      GS_LONGITUDE_DEG: ${GS_LONGITUDE_DEG:--46.6333}
      GS_ALTITUDE_M: ${GS_ALTITUDE_M:-760}
      GS_MIN_ELEVATION_DEG: ${GS_MIN_ELEVATION_DEG:-0}
      TRACKING_DATA_DIR: /app/data
      # Idade máxima do TLE em cache, em minutos, antes de revalidar no
      # CelesTrak. Este serviço é o único que escreve e lê esse cache.
      TRACKING_CACHE_MAX_AGE_MINUTES: ${TRACKING_CACHE_MAX_AGE_MINUTES:-15}
    ports:
      - "5591:5591"   # API de leitura do plano — é daqui que o painel se serve
    depends_on:
      postgres:
        condition: service_healthy
      station-manager:
        condition: service_started
    volumes:
      - ./src:/app/src
      - ./libs:/app/libs
      - ./tools:/app/tools
      # Cache de TLE: preserva o fallback offline do celestrak entre restarts.
      # Antes o GRS Manager montava este mesmo volume para poder revalidar os
      # TLEs pelo painel; agora ele pede a revalidação por HTTP, e o cache tem
      # um único processo mexendo nele.
      - tracking_data:/app/data
    networks:
      - spacelab-network

  station-manager:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: spacelab-station-manager
    # --rotor mock, e não zmq: o RotorManager vendorizado tem o socket SUB fixo
    # em tcp://localhost:5560 (vendor/grs-rotor-manager/rotor_manager.py), o que
    # só funciona com o simulador no mesmo host de rede — nunca entre containers.
    # Rodar contra o rotor físico/simulado continua sendo fora do Docker.
    command:
      - python
      - -m
      - mgm8.rotor_zmq.main
      - --bind=tcp://0.0.0.0:5580
      - --rotor=mock
      # Abaixo desta elevação o satélite está do outro lado da Terra e o azimute
      # varia de forma abrupta — seguir isso só castigaria o rotor. Baixe para
      # -90 quando quiser exercitar o apontamento sem esperar uma passagem real.
      - --pointing-min-elevation=${STATION_POINTING_MIN_ELEVATION:-0}
      - --pointing-interval=${STATION_POINTING_INTERVAL_SECONDS:-1}
    ports:
      - "5580:5580"   # ZMQ REP — comandos de rotor
    environment:
      # Mesmas coordenadas do TC Scheduler: os dois precisam concordar sobre de
      # onde a estação observa, ou o plano e o apontamento divergem.
      GS_NAME: ${GS_NAME:-Estação de Teste}
      GS_LATITUDE_DEG: ${GS_LATITUDE_DEG:--23.5505}
      GS_LONGITUDE_DEG: ${GS_LONGITUDE_DEG:--46.6333}
      GS_ALTITUDE_M: ${GS_ALTITUDE_M:-760}
    volumes:
      - ./src:/app/src
      - ./libs:/app/libs
    networks:
      - spacelab-network

volumes:
  postgres_data:
  tracking_data:

networks:
  spacelab-network:
    driver: bridge
